# Docker Compose configuration with full audio support
# This version requires host audio system configuration

version: '3.8'

services:
  voice-chatbot:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PULSE_RUNTIME_PATH=/tmp/pulse-socket
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      # Mount .env file
      - ./.env:/app/.env:ro
      # Audio support for Linux
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/${UID:-1000}/pulse:/tmp/pulse-socket:ro
      # Alternative: Direct ALSA access
      - /dev/snd:/dev/snd:rw
    devices:
      # Grant access to audio devices
      - /dev/snd:/dev/snd
    privileged: false
    # Add audio group access
    group_add:
      - audio
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.service=voice-chatbot"
      - "description=AI Voice Chatbot with full audio support"

# For macOS users - requires additional setup
  voice-chatbot-macos:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    profiles:
      - macos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# For Windows users - requires Windows-specific audio configuration
  voice-chatbot-windows:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    profiles:
      - windows
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge